name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan / build
        uses: leanprover/lean-action@v1
      - name: Integration regression suite
        run: lake exe taschenrechner --regression
      - name: Matrix regression suite
        run: lake exe taschenrechner --matrix-regression
